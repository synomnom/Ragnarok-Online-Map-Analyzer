<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragnarok Online Map Analyzer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: Arial, Helvetica, sans-serif;
    padding: 25px;
}

h1 {
    color: #60a5fa;
    margin-top: 0;
    margin-bottom: 22px;
}

h2 {
    color: #93c5fd;
    margin-top: 0;
}

.panel {
    background: #1e293b;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.search-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.search-row label {
    color: #cbd5e1;
    font-weight: bold;
    white-space: nowrap;
}

.search-row input {
    flex: 1;
    min-width: 0;
}

.filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
}

.filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
}

label {
    color: #cbd5e1;
    font-weight: bold;
}

select,
input {
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 9px 10px;
}

select {
    min-width: 180px;
}

input {
    min-width: 220px;
}

select:focus,
input:focus {
    outline: none;
    border-color: #60a5fa;
}

.table-panel {
    background: #1e293b;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.table-container {
    width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #1e293b;
}

thead th {
    background: #334155;
    color: #f8fafc;
    padding: 0;
    text-align: right;
    position: sticky;
    top: 0;
    z-index: 2;
}

thead th:first-child,
thead th:nth-child(2),
thead th:nth-child(5) {
    text-align: left;
}

th button {
    appearance: none;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: bold;
    width: 100%;
    padding: 11px 10px;
    cursor: pointer;
    text-align: inherit;
    white-space: nowrap;
}

th button:hover {
    background: #475569;
}

.sort-indicator {
    display: inline-block;
    position: relative;
    width: 12px;
    height: 12px;
    margin-left: 7px;
    vertical-align: middle;
}

.sort-indicator::before,
.sort-indicator::after {
    content: "";
    position: absolute;
    left: 3px;
    width: 0;
    height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
}

.sort-indicator::before {
    top: 0;
    border-bottom: 4px solid #64748b;
}

.sort-indicator::after {
    bottom: 0;
    border-top: 4px solid #64748b;
}

th.active-asc .sort-indicator::before {
    border-bottom-color: #60a5fa;
}

th.active-asc .sort-indicator::after {
    border-top-color: #475569;
}

th.active-desc .sort-indicator::before {
    border-bottom-color: #475569;
}

th.active-desc .sort-indicator::after {
    border-top-color: #60a5fa;
}

td {
    padding: 9px 10px;
    border-bottom: 1px solid #334155;
    text-align: right;
}

td.map {
    text-align: left;
    font-weight: bold;
    color: #f8fafc;
}

td.race {
    text-align: left;
    color: #c084fc;
}

tr:hover {
    background: #334155;
}

.density {
    color: #4ade80;
}

.delay-density {
    color: #38bdf8;
    font-weight: bold;
}

@media (max-width: 900px) {
    body {
        padding: 15px;
    }

    .search-row {
        flex-direction: column;
        align-items: stretch;
    }

    .search-row input {
        width: 100%;
    }

    .filter-row {
        flex-direction: column;
        align-items: stretch;
    }

    .filter-group {
        justify-content: space-between;
    }

    select {
        flex: 1;
    }

    table {
        font-size: 13px;
    }

    th button {
        white-space: normal;
    }
}
</style>
</head>

<body>

<h1>Ragnarok Online Map Analyzer</h1>

<div class="panel">
    <div class="search-row">
        <label for="mapSearch">Map:</label>
        <input
            id="mapSearch"
            type="text"
            placeholder="Search map..."
            autocomplete="off"
        >
    </div>
</div>

<div class="panel">
    <div class="filter-row">

        <div class="filter-group">
            <label for="raceFilter">Race:</label>
            <select id="raceFilter">
                <option value="ALL">All races</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="elementFilter">Element:</label>
            <select id="elementFilter">
                <option value="ALL">All elements</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="mobFilter">Monster:</label>
            <select id="mobFilter">
                <option value="ALL">All monsters</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="delayValue">Exclude Delay &emsp; &gt;</label>
            <input id="delayValue" type="number" placeholder="enter number" min="0" step="1">
            <span style="color:#cbd5e1;font-weight:bold;">seconds</span>
        </div>

    </div>
</div>

<div class="table-panel">

    <h2>Map Ranking</h2>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th data-sort="index">
                        <button type="button">
                            #
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                    <th data-sort="map">
                        <button type="button">
                            Map
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                    <th data-sort="walkable">
                        <button type="button">
                            Walkable Cells
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                    <th data-sort="monsters">
                        <button type="button">
                            Monsters
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                    <th data-sort="race">
                        <button type="button">
                            Race
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                    <th data-sort="density">
                        <button type="button">
                            Overall Map Density
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                    <th data-sort="filterDensity">
                        <button type="button">
                            Filter Density
                            <span class="sort-indicator"></span>
                        </button>
                    </th>

                </tr>

            </thead>

            <tbody id="resultBody"></tbody>

        </table>

    </div>

</div>

function number(value, decimals) {
    var n = Number(value);
    if (!isFinite(n)) n = 0;
    return n.toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}

function getValue(object, names, fallback) {
    for (var i = 0; i < names.length; i++) {
        var key = names[i];
        if (
            object &&
            object[key] !== undefined &&
            object[key] !== null &&
            String(object[key]).trim() !== ""
        ) {
            return object[key];
        }
    }
    return fallback;
}

function getRace() {
    return document.getElementById("raceFilter").value;
}

function getElement() {
    return document.getElementById("elementFilter").value;
}

function getMob() {
    return document.getElementById("mobFilter").value;
}

function getDelayValue() {
    var el = document.getElementById("delayValue");
    if (!el) return null;
    var v = String(el.value).trim();
    if (v === "") return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
}

function isDelayFilterActive() {
    return getDelayValue() !== null;
}
function getSpawnDelay(spawn) {
    var d = getValue(spawn, ["Delay", "Respawn", "RespawnDelay", "delay", "respawn"], 0);
    var n = Number(d);
    return isFinite(n) ? n : 0;
}

function getBaseSpawns() {
    var race = getRace();
    var element = getElement();
    var mob = getMob();
    var out = [];

    for (var i = 0; i < SPAWNS.length; i++) {
        var spawn = SPAWNS[i];
        if (race !== "ALL" && getValue(spawn, ["Race"], "Unknown") !== race) continue;
        if (element !== "ALL" && getValue(spawn, ["Element"], "Unknown") !== element) continue;
        if (mob !== "ALL" && String(getValue(spawn, ["MobId"], "")) !== mob) continue;
        out.push(spawn);
    }
    return out;
}

function getSpawnDelay(spawn) {
    var d = getValue(spawn, ["Delay", "Respawn", "RespawnDelay", "delay", "respawn"], 0);
    var n = Number(d);
    return isFinite(n) ? n : 0;
}

function matchesDelayExclude(spawn) {
    var value = getDelayValue();
    if (value === null) return false;

    var delay = getSpawnDelay(spawn);
    var op = getDelayOperator();

    if (op === ">")  return delay > value;
    if (op === ">=") return delay >= value;
    if (op === "<")  return delay < value;
    if (op === "<=") return delay <= value;
    if (op === "=")  return delay === value;
    return false;
}

function getDelayFilteredSpawns() {

    // Start with Race + Element + Monster.
    var base = getBaseSpawns();

    // Delay is ALWAYS the last filter.
    var value = getDelayValue();

    // No Delay filter.
    if (value === null) {
        return base;
    }

    var out = [];

    for (var i = 0; i < base.length; i++) {

        var delay = getSpawnDelay(base[i]);

        // Exclude Delay > selected value.
        if (delay > value) continue;

        out.push(base[i]);
    }

    return out;
}

    var select = document.getElementById("raceFilter");
    if (!select) return;

    var races = {};
    for (var i = 0; i < SPAWNS.length; i++) {
        races[String(getValue(SPAWNS[i], ["Race"], "Unknown"))] = true;

    var keys = Object.keys(races).sort(function(a, b) {

        var option = document.createElement("option");
        option.value = keys[j];

    }

        var option = document.createElement("option");
        option.value = keys[j];
        option.textContent = keys[j];
        select.appendChild(option);
    }
}

function rebuildMobFilter() {
    var select = document.getElementById("mobFilter");
    if (!select) return;

    var selectedRace = getRace();
    var selectedElement = getElement();
    var current = select.value;

    select.innerHTML = "";

    var all = document.createElement("option");
    all.value = "ALL";
    all.textContent = "All monsters";
    select.appendChild(all);

    var mobs = {};
    for (var i = 0; i < SPAWNS.length; i++) {
        var spawn = SPAWNS[i];
        var race = getValue(spawn, ["Race"], "Unknown");
        var element = getValue(spawn, ["Element"], "Unknown");

        if (selectedRace !== "ALL" && race !== selectedRace) continue;
        if (selectedElement !== "ALL" && element !== selectedElement) continue;

        var id = String(getValue(spawn, ["MobId"], ""));
        var name = String(getValue(spawn, ["MobName"], "Unknown"));
        if (id) mobs[id] = { id: id, name: name };
    }

    var ids = Object.keys(mobs).sort(function(a, b) {
        return mobs[a].name.localeCompare(mobs[b].name);
    });

    for (var j = 0; j < ids.length; j++) {
        var mid = ids[j];
        var option = document.createElement("option");
        option.value = mid;
        option.textContent = mobs[mid].name + " [" + mid + "]";
        select.appendChild(option);
    }

    var valid = false;
    for (var k = 0; k < select.options.length; k++) {
        if (select.options[k].value === current) {
            valid = true;
            break;
        }
    }
    if (valid) select.value = current;
}

function groupByMap(spawns) {
    var byMap = {};
    for (var i = 0; i < spawns.length; i++) {
        var mapName = String(getValue(spawns[i], ["Map"], ""));
        if (!byMap[mapName]) byMap[mapName] = [];
        byMap[mapName].push(spawns[i]);
    }
    return byMap;
}

function getOverallByMap() {

    if (overallByMapCache !== null) {
        return overallByMapCache;
    }

    overallByMapCache = groupByMap(SPAWNS);

    return overallByMapCache;
}
function sumAmounts(spawns) {
    var total = 0;
    if (!spawns) return 0;
    for (var i = 0; i < spawns.length; i++) {
        var a = Number(getValue(spawns[i], ["Amount"], 0));
        if (isFinite(a)) total += a;
    }
    return total;
}

function buildRows() {

    var overallByMap = getOverallByMap();

   
    var filteredSpawns = getDelayFilteredSpawns();

   
    var filteredByMap = groupByMap(filteredSpawns);


    var normalFilteredSpawns = getBaseSpawns();

    var normalFilteredByMap =
        groupByMap(normalFilteredSpawns);


    var search = getSearch();

    var rows = [];



    for (var i = 0; i < MAPS.length; i++) {

        var map = MAPS[i];

        var mapName = String(
            getValue(
                map,
                ["Map"],
                ""
            )
        );

        if (!mapName) continue;


        /*
         * Search controls visibility only.
         */

        if (
            search &&
            mapName.toLowerCase().indexOf(search) === -1
        ) {
            continue;
        }

        var overallMapSpawns =
            overallByMap[mapName] || [];

        var overallMonsters =
            sumAmounts(overallMapSpawns);

        if (overallMonsters <= 0) continue;

        var filteredMapSpawns =
            filteredByMap[mapName] || [];

        var filteredMonsters =
            sumAmounts(filteredMapSpawns);


        var walkable = Number(
            getValue(
                map,
                ["WalkableCells"],
                0
            )
        );

        if (!isFinite(walkable)) {
            walkable = 0;
        }

        var density = walkable > 0
            ? (
                overallMonsters /
                walkable *
                1000
            )
            : 0;

        var filterDensity = walkable > 0
            ? (
                filteredMonsters /
                walkable *
                1000
            )
            : 0;


        var raceMapSpawns =
            normalFilteredByMap[mapName] || [];

        var races = {};

        for (
            var j = 0;
            j < raceMapSpawns.length;
            j++
        ) {

            var race = String(
                getValue(
                    raceMapSpawns[j],
                    ["Race"],
                    "Unknown"
                )
            );

            races[race] = true;
        }

        var raceKeys =
            Object.keys(races).sort();

        rows.push({

            mapName: mapName,

            /*
             * Always ALL monsters.
             */
            monsters: overallMonsters,

            walkable: walkable,

            raceText:
                raceKeys.length
                    ? raceKeys.join(", ")
                    : "N/A",

            /*
             * Always ALL monsters.
             */
            density: density,

            /*
             * Current active filters.
             */
            filterDensity: filterDensity
        });
    }

    return rows;
}

function compareValues(a, b, key) {

    switch (key) {

        case "map":
            return a.mapName.localeCompare(b.mapName);

        case "walkable":
            return Number(a.walkable) - Number(b.walkable);

        case "monsters":
            return Number(a.monsters) - Number(b.monsters);

        case "race":
            return a.raceText.localeCompare(b.raceText);

        case "density":
            return Number(a.density) - Number(b.density);

        case "filterDensity":
            return Number(a.filterDensity) -
                   Number(b.filterDensity);

        case "index":
            return 0;

        default:
            return 0;
    }
}

function sortRows(rows) {
    var direction = sortState.direction === "asc" ? 1 : -1;

    rows.sort(function(a, b) {
        var result = compareValues(a, b, sortState.key);
        if (result === 0) return a.mapName.localeCompare(b.mapName);
        return result * direction;
    });

    return rows;
}

function updateSortIndicators() {
    var headers = document.querySelectorAll("thead th");
    for (var i = 0; i < headers.length; i++) {
        var th = headers[i];
        th.classList.remove("active-asc", "active-desc");
        if (th.getAttribute("data-sort") === sortState.key) {
            th.classList.add(
                sortState.direction === "asc" ? "active-asc" : "active-desc"
            );
        }
    }
}



function setupSorting() {

    var headers =
        document.querySelectorAll("thead th");

    for (var i = 0; i < headers.length; i++) {

        (function(th) {

            var button =
                th.querySelector("button");

            if (!button) return;

            button.addEventListener(
                "click",
                function() {

                    var key =
                        th.getAttribute("data-sort");

                    userHasManuallySorted = true;


                    /*
                     * IMPORTANT:
                     *
                     * Sorting ONLY changes the order.
                     *
                     * It does NOT rebuild/filter the data.
                     */

                    if (sortState.key === key) {

                        sortState.direction =
                            sortState.direction === "desc"
                                ? "asc"
                                : "desc";

                    }
                    else {

                        sortState.key = key;
                        sortState.direction = "desc";
                    }


                    updateSortIndicators();

                    renderCurrentRows();
                }
            );

        })(headers[i]);
    }
}

var currentRows = [];

function renderCurrentRows() {

    var body =
        document.getElementById("resultBody");

    if (!body) return;


    /*
     * Sort a copy so the original filtered data remains
     * untouched.
     */

    var rows =
        currentRows.slice();

    sortRows(rows);

    body.innerHTML = "";


    if (rows.length === 0) {

        var emptyTr =
            document.createElement("tr");

        var emptyTd =
            document.createElement("td");

        emptyTd.colSpan = 7;
        emptyTd.style.textAlign = "left";
        emptyTd.style.color = "#94a3b8";

        emptyTd.textContent =
            "No maps match current filters. " +
            "SPAWNS=" + SPAWNS.length +
            ", MAPS=" + MAPS.length + ".";

        emptyTr.appendChild(emptyTd);
        body.appendChild(emptyTr);

        return;
    }


    for (var i = 0; i < rows.length; i++) {

        var item = rows[i];

        var tr =
            document.createElement("tr");


        function addCell(value, className) {

            var td =
                document.createElement("td");

            td.textContent = value;

            if (className) {
                td.className = className;
            }

            tr.appendChild(td);
        }


        addCell(i + 1);
        addCell(item.mapName, "map");
        addCell(number(item.walkable, 0));
        addCell(number(item.monsters, 0));
        addCell(item.raceText, "race");
        addCell(number(item.density, 2), "density");
        addCell(
            number(item.filterDensity, 2),
            "delay-density"
        );


        body.appendChild(tr);
    }
}


function refreshRows() {

    /*
     * Filters/search changed.
     *
     * Recalculate the current rows.
     *
     * Overall data itself remains cached and
     * completely independent from the filters.
     */

    currentRows = buildRows();

    renderCurrentRows();
}


function render() {
    refreshRows();
}

function setupEvents() {

    function on(id, event, handler) {

        var el =
            document.getElementById(id);

        if (!el) return;

        el.addEventListener(event, handler);
    }


    /*
     * Search changes visible rows.
     */

    on(
        "mapSearch",
        "input",
        function() {
            refreshRows();
        }
    );


    /*
     * Race changes filter data and rebuilds
     * the available Monster list.
     */

    on(
        "raceFilter",
        "change",
        function() {

            rebuildMobFilter();

            refreshRows();
        }
    );


    /*
     * Element changes filter data and rebuilds
     * the available Monster list.
     */

    on(
        "elementFilter",
        "change",
        function() {

            rebuildMobFilter();

            refreshRows();
        }
    );


    /*
     * Monster changes filter data.
     */

    on(
        "mobFilter",
        "change",
        function() {
            refreshRows();
        }
    );


    /*
     * Delay is ALWAYS the LAST filter.
     *
     * IMPORTANT:
     * Delay does NOT change the sort state.
     */

    function onDelayFilterChange() {

        refreshRows();
    }


    on(
        "delayValue",
        "input",
        onDelayFilterChange
    );

    on(
        "delayValue",
        "change",
        onDelayFilterChange
    );
}

function initialize() {
    try {
        if (!document.getElementById("resultBody")) {
            throw new Error("Missing #resultBody in HTML");
        }
        if (!document.getElementById("raceFilter")) {
            throw new Error("Missing #raceFilter in HTML");
        }
        if (!document.getElementById("elementFilter")) {
            throw new Error("Missing #elementFilter in HTML");
        }
        if (!document.getElementById("mobFilter")) {
            throw new Error("Missing #mobFilter in HTML");
        }

        buildRaceFilter();
        buildElementFilter();
        rebuildMobFilter();
        setupSorting();
        setupEvents();
        updateSortIndicators();
        render();
    } catch (err) {
        var body = document.getElementById("resultBody");
        if (body) {
            body.innerHTML =
                '<tr><td colspan="7" style="text-align:left;color:#f87171;">' +
                "JS error: " + String(err && err.message ? err.message : err) +
                "</td></tr>";
        }
        if (window.console && console.error) console.error(err);
    }
}

initialize();

</script>

</body>
</html>
