<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ragnarok Online Map Analyzer</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px;background:#0f172a;color:#e5e7eb;font-family:Arial,Helvetica,sans-serif}
h1{margin:0 0 22px;color:#60a5fa} h2{margin:0 0 14px;color:#93c5fd}
.panel,.table-panel{margin-bottom:20px;padding:18px;background:#1e293b;border-radius:10px}
.search-row,.filter-row,.filter-group{display:flex;align-items:center;gap:12px}
.filter-row{flex-wrap:wrap;gap:18px}.search-row input{flex:1;min-width:0}
label{font-weight:bold;color:#cbd5e1;white-space:nowrap}
select,input{padding:9px 10px;color:#f8fafc;background:#0f172a;border:1px solid #475569;border-radius:6px}
select{min-width:180px} input{min-width:220px}
select:focus,input:focus{outline:none;border-color:#60a5fa}
table{width:100%;border-collapse:collapse} thead th{padding:0;text-align:right;background:#334155}
thead th:nth-child(1),thead th:nth-child(2),thead th:nth-child(6){text-align:left}
th button{width:100%;padding:11px 10px;text-align:inherit;font:inherit;font-weight:bold;color:inherit;background:transparent;border:0;cursor:pointer}
th button:hover{background:#475569}.sort-indicator{margin-left:6px;color:#64748b}
.active-asc .sort-indicator::after{content:" ↑";color:#60a5fa}.active-desc .sort-indicator::after{content:" ↓";color:#60a5fa}
td{padding:9px 10px;text-align:right;border-bottom:1px solid #334155}td.map,td.race{text-align:left}
td.map{font-weight:bold}td.race{color:#c084fc}.density{color:#4ade80}.filter-density{font-weight:bold;color:#38bdf8}
@media(max-width:900px){body{padding:15px}.search-row,.filter-row{flex-direction:column;align-items:stretch}.filter-group{justify-content:space-between}select,input{width:100%;min-width:0}table{font-size:13px}}
</style>
</head>
<body>
<h1>Ragnarok Online Map Analyzer</h1>

<div class="panel"><div class="search-row">
<label for="mapSearch">Map:</label>
<input id="mapSearch" type="search" placeholder="Search map..." autocomplete="off">
</div></div>

<div class="panel"><div class="filter-row">
<div class="filter-group"><label for="raceFilter">Race:</label><select id="raceFilter"></select></div>
<div class="filter-group"><label for="elementFilter">Element:</label><select id="elementFilter"></select></div>
<div class="filter-group"><label for="mobFilter">Monster:</label><select id="mobFilter"></select></div>
<div class="filter-group"><label for="delayValue">Exclude Delay &gt;</label><input id="delayValue" type="number" min="0" step="1" placeholder="seconds"><span>seconds</span></div>
</div></div>

<div class="table-panel">
<h2>Map Ranking</h2>
<table>
<thead><tr>
<th data-sort="index"><button type="button">#<span class="sort-indicator"></span></button></th>
<th data-sort="map"><button type="button">Map<span class="sort-indicator"></span></button></th>
<th data-sort="walkable"><button type="button">Walkable Cells<span class="sort-indicator"></span></button></th>
<th data-sort="monsters"><button type="button">All Monsters<span class="sort-indicator"></span></button></th>
<th data-sort="filteredMonsters"><button type="button">Filtered Monsters<span class="sort-indicator"></span></button></th>
<th data-sort="race"><button type="button">Race<span class="sort-indicator"></span></button></th>
<th data-sort="density"><button type="button">Overall Map Density<span class="sort-indicator"></span></button></th>
<th data-sort="filterDensity"><button type="button">Filter Density<span class="sort-indicator"></span></button></th>
</tr></thead>
<tbody id="resultBody"></tbody>
</table>
</div>

}
function buildFilters() {

}

  for (var i = 0; i < MOBS.length; i++) { var m = MOBS[i]; if (race !== "ALL" && text(m[2], "Unknown") !== race) continue; if (element !== "ALL" && text(m[3], "Unknown") !== element) continue; var id = text(m[0], ""); if (id) mobs[id] = { value: id, label: text(m[1], "Unknown") + " [" + id + "]" }; }
  var items = Object.keys(mobs).map(function(id) { return mobs[id]; }); items.sort(function(a, b) { return a.label.localeCompare(b.label); }); setOptions($("mobFilter"), items, "All monsters");
  for (var j = 0; j < $("mobFilter").options.length; j++) if ($("mobFilter").options[j].value === previous) { $("mobFilter").value = previous; break; }
}
function getFilteredSpawns() {
  var race = $("raceFilter").value, element = $("elementFilter").value, mob = $("mobFilter").value, delayText = $("delayValue").value.trim(), delayLimit = delayText === "" ? null : number(delayText);

}

    rows.push({ mapName: mapName, walkable: walkable, monsters: overallStats.monsters, filteredMonsters: filteredMonsters, raceText: races.join(", ") || "Unknown", density: overallStats.density, filterDensity: walkable > 0 ? filteredMonsters / walkable * 1000 : 0 });
  }

function compare(a, b, key) { if (key === "map") return a.mapName.localeCompare(b.mapName); if (key === "race") return a.raceText.localeCompare(b.raceText); if (key === "walkable") return a.walkable - b.walkable; if (key === "monsters") return a.monsters - b.monsters; if (key === "filteredMonsters") return a.filteredMonsters - b.filteredMonsters; if (key === "density") return a.density - b.density; if (key === "filterDensity") return a.filterDensity - b.filterDensity; return 0; }
function updateIndicators() { var headers = document.querySelectorAll("thead th"); for (var i = 0; i < headers.length; i++) { var active = headers[i].dataset.sort === state.key; headers[i].classList.toggle("active-asc", active && state.direction === "asc"); headers[i].classList.toggle("active-desc", active && state.direction === "desc"); } }
function render() {
  var rows = buildRows(); rows.sort(function(a, b) { var result = compare(a, b, state.key); if (result === 0) result = a.mapName.localeCompare(b.mapName); return result * (state.direction === "asc" ? 1 : -1); });

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], values = [[i + 1, ""], [r.mapName, "map"], [format(r.walkable, 0), ""], [format(r.monsters, 0), ""], [format(r.filteredMonsters, 0), ""], [r.raceText, "race"], [format(r.density, 2), "density"], [format(r.filterDensity, 2), "filter-density"]], tr = document.createElement("tr");
    for (var j = 0; j < values.length; j++) { var td = document.createElement("td"); td.textContent = values[j][0]; td.className = values[j][1]; tr.appendChild(td); }

document.querySelectorAll("thead th button").forEach(function(button) { button.addEventListener("click", function() { var key = button.parentElement.dataset.sort; if (state.key === key) state.direction = state.direction === "asc" ? "desc" : "asc"; else { state.key = key; state.direction = "desc"; } render(); }); });
$("mapSearch").addEventListener("input", render);

$("elementFilter").addEventListener("change", function() { rebuildMobFilter(); render(); });
$("mobFilter").addEventListener("change", render);
